version: 2

project_name: edcctl

before:
  hooks:
    - go mod tidy

builds:
  - id: edcctl
    main: ./cmd/edcctl
    binary: edcctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jwmoss/edcctl/internal/cli.version={{ .Version }}
      - -X github.com/jwmoss/edcctl/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/jwmoss/edcctl/internal/cli.date={{ .Date }}

archives:
  - id: edcctl
    ids:
      - edcctl
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: jwmoss
    name: edcctl
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

homebrew_casks:
  - name: edcctl
    ids:
      - edcctl
    repository:
      owner: jwmoss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/jwmoss/edcctl"
    description: "Read Evolution Dance Complex schedules and app notifications"
    license: MIT
    binaries:
      - edcctl
    # Releases still work without a cross-repository token; publish the cask manually.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'

